<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF9" />
  <title>Asli — असली या नक़ली? · AI Image Verification</title>
  <meta name="description" content="Detect AI-generated and manipulated images. Plain-language explanations in Hindi, Gujarati, or English. Free." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN with brand-colour config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'asli-green':       '#16A34A',
            'asli-green-light': '#DCFCE7',
            'nakli-red':        '#DC2626',
            'nakli-red-light':  '#FEE2E2',
            'shak-amber':       '#D97706',
            'shak-amber-light': '#FEF3C7',
            'asli-bg':          '#FAFAF9',
            'asli-text':        '#1C1917',
            'asli-muted':       '#78716C',
          },
          fontFamily: {
            sans:  ['Inter', 'system-ui', 'sans-serif'],
            deva:  ['"Noto Sans Devanagari"', 'Inter', 'sans-serif'],
            guja:  ['"Noto Sans Gujarati"',   'Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Lucide icons via CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <link rel="stylesheet" href="styles.css" />

  <!-- API endpoint — change this after Cloud Run deploy -->
  <script>
    window.ASLI_API_URL = window.ASLI_API_URL || 'http://localhost:8000';
  </script>
</head>
<body class="bg-asli-bg text-asli-text antialiased min-h-screen flex flex-col font-sans">

  <!-- ─── Header ─── -->
  <header class="sticky top-0 z-30 bg-asli-bg/85 backdrop-blur border-b border-stone-200">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="assets/logo.svg" alt="Asli" class="w-8 h-8" />
        <span class="font-extrabold text-lg tracking-tight">Asli</span>
      </div>
      <div class="flex items-center gap-1 text-sm bg-white border border-stone-200 rounded-full p-0.5">
        <button data-lang="hi" class="lang-btn px-3 py-1 rounded-full font-semibold font-deva transition">हिं</button>
        <button data-lang="gu" class="lang-btn px-3 py-1 rounded-full font-semibold font-guja transition">ગુ</button>
        <button data-lang="en" class="lang-btn px-3 py-1 rounded-full font-semibold transition">EN</button>
      </div>
    </div>
  </header>

  <!-- ─── Main ─── -->
  <main class="flex-1 max-w-md mx-auto w-full px-4 py-6">

    <!-- SCREEN A — UPLOAD (two sub-states: pick → ready) -->
    <section id="screen-upload" class="screen">
      <div class="text-center mb-8 mt-4">
        <h1 id="hero" class="text-4xl font-extrabold tracking-tight leading-tight mb-3"></h1>
        <p id="subhero" class="text-asli-muted text-base"></p>
      </div>

      <!-- Sub-state 1: PICK (no file yet) -->
      <div id="upload-pick">
        <label
          id="dropzone"
          for="file-input"
          class="block cursor-pointer rounded-2xl border-2 border-dashed border-stone-300 bg-white px-6 py-12 text-center transition-all hover:border-asli-green hover:bg-stone-50">
          <div class="flex flex-col items-center gap-3">
            <div class="w-16 h-16 rounded-full bg-asli-green-light flex items-center justify-center">
              <i data-lucide="upload-cloud" class="w-8 h-8 text-asli-green"></i>
            </div>
            <p id="dropzone-text" class="font-semibold text-asli-text"></p>
            <p id="dropzone-hint" class="text-sm text-asli-muted"></p>
          </div>
        </label>
        <input id="file-input" type="file" accept="image/*" class="sr-only" />

        <div class="flex items-center my-6 gap-3 text-stone-400 text-xs uppercase tracking-wider">
          <div class="flex-1 h-px bg-stone-200"></div>
          <span id="or-text">or</span>
          <div class="flex-1 h-px bg-stone-200"></div>
        </div>

        <label
          for="camera-input"
          class="cursor-pointer rounded-xl bg-asli-text text-white font-semibold py-4 text-center flex items-center justify-center gap-2 hover:bg-stone-800 transition w-full">
          <i data-lucide="camera" class="w-5 h-5"></i>
          <span id="camera-text">Take a photo</span>
        </label>
        <input id="camera-input" type="file" accept="image/*" capture="environment" class="sr-only" />
      </div>

      <!-- Sub-state 2: READY-TO-EVALUATE (file picked, awaiting confirmation) -->
      <div id="upload-ready" class="hidden">
        <div class="rounded-2xl bg-white border border-stone-200 p-3 mb-4 shadow-sm">
          <div class="rounded-xl overflow-hidden bg-stone-100 aspect-[4/3] flex items-center justify-center">
            <img id="preview-image" alt="" class="w-full h-full object-contain" />
          </div>
          <div class="flex items-center justify-between mt-3 px-1">
            <p class="text-xs text-asli-muted truncate flex-1 mr-3">
              <i data-lucide="image" class="w-3.5 h-3.5 inline-block -mt-0.5"></i>
              <span id="preview-filename"></span>
            </p>
            <button
              id="change-image-btn"
              class="text-xs font-semibold text-asli-text hover:underline shrink-0 inline-flex items-center gap-1">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
              <span id="change-image-text"></span>
            </button>
          </div>
        </div>

        <button
          id="evaluate-btn"
          class="w-full rounded-xl bg-asli-green text-white font-bold py-4 text-base flex items-center justify-center gap-2 hover:bg-green-700 transition shadow-md">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
          <span id="evaluate-text"></span>
        </button>
      </div>
    </section>

    <!-- SCREEN B — SCANNING -->
    <section id="screen-scanning" class="screen hidden">
      <div class="text-center pt-6">
        <div class="relative inline-block rounded-2xl overflow-hidden bg-stone-100 mb-8 max-w-xs shadow-lg">
          <img id="scanning-image" alt="" class="w-full h-auto blur-sm opacity-75" />
          <div class="absolute inset-0 pointer-events-none">
            <div class="scan-line"></div>
          </div>
          <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/10"></div>
        </div>
        <div class="flex items-center justify-center gap-2 mb-3">
          <span class="w-2.5 h-2.5 rounded-full bg-asli-green animate-pulse"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-asli-green animate-pulse" style="animation-delay: 200ms"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-asli-green animate-pulse" style="animation-delay: 400ms"></span>
        </div>
        <p id="scan-status" class="text-asli-text font-medium text-base"></p>
      </div>
    </section>

    <!-- SCREEN C — RESULT -->
    <section id="screen-result" class="screen hidden">
      <!-- Verdict badge -->
      <div id="verdict-badge" class="rounded-2xl p-6 text-center mb-5">
        <div id="verdict-icon" class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center mx-auto mb-3"></div>
        <p id="verdict-label" class="text-white text-3xl font-extrabold tracking-tight"></p>
        <p id="confidence-text" class="text-white/85 text-sm mt-1"></p>
      </div>

      <!-- Confidence + thumbnail row -->
      <div class="flex items-center gap-4 mb-5 bg-white rounded-xl p-4 border border-stone-200">
        <img id="result-thumb" alt="" class="w-16 h-16 rounded-lg object-cover bg-stone-100 shrink-0" />
        <div class="flex-1 min-w-0">
          <p id="confidence-label-i18n" class="text-xs uppercase tracking-wider text-asli-muted mb-1"></p>
          <p class="text-3xl font-extrabold leading-none">
            <span id="confidence-num">0</span><span class="text-lg text-asli-muted">%</span>
          </p>
        </div>
      </div>

      <!-- Explanation card -->
      <div class="bg-white rounded-xl p-5 mb-4 border border-stone-200">
        <p id="explanation-label" class="text-xs uppercase tracking-wider text-asli-muted mb-2"></p>
        <p id="explanation-text" class="text-asli-text leading-relaxed"></p>
      </div>

      <!-- Red flags card -->
      <div id="redflags-container" class="bg-white rounded-xl p-5 mb-4 border border-stone-200">
        <p id="redflags-label" class="text-xs uppercase tracking-wider text-asli-muted mb-3"></p>
        <ul id="redflags-list" class="space-y-2"></ul>
      </div>

      <!-- Tip card -->
      <div class="rounded-xl p-5 mb-6 bg-amber-50 border border-amber-200">
        <div class="flex gap-3">
          <div class="w-9 h-9 shrink-0 rounded-lg bg-amber-100 flex items-center justify-center">
            <i data-lucide="lightbulb" class="w-5 h-5 text-amber-700"></i>
          </div>
          <div class="min-w-0">
            <p id="tip-label" class="text-xs uppercase tracking-wider text-amber-700 mb-1"></p>
            <p id="tip-text" class="text-amber-900 leading-relaxed text-sm"></p>
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button id="scan-another-btn" class="rounded-xl bg-asli-text text-white font-semibold py-4 hover:bg-stone-800 transition">
          <span id="scan-another-text"></span>
        </button>
        <button id="share-btn" class="rounded-xl bg-asli-green text-white font-semibold py-4 hover:bg-green-700 transition flex items-center justify-center gap-2">
          <i data-lucide="share-2" class="w-5 h-5"></i>
          <span id="share-text"></span>
        </button>
      </div>
    </section>

    <!-- ERROR STATE -->
    <section id="screen-error" class="screen hidden">
      <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center mt-6">
        <div class="w-16 h-16 rounded-full bg-red-100 mx-auto mb-3 flex items-center justify-center">
          <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
        </div>
        <p id="error-title" class="font-semibold mb-2"></p>
        <p id="error-message" class="text-sm text-asli-muted mb-4 break-words"></p>
        <button id="retry-btn" class="rounded-xl bg-asli-text text-white font-semibold py-3 px-6">
          <span id="retry-text"></span>
        </button>
      </div>
    </section>

  </main>

  <footer class="text-center text-xs text-asli-muted py-4 px-4">
    <span id="footer-text"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
